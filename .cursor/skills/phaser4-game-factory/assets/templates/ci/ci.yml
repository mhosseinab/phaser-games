# .github/workflows/ci.yml — affected lint/typecheck/test/build. See references/04-ci-cd.md.
name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}   # Vercel Remote Cache (optional but recommended)
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }            # REQUIRED for turbo --affected to diff vs origin/main

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }          # do NOT use cache:'pnpm' — cache the store below

      - name: Locate pnpm store
        id: pnpm
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build --affected
