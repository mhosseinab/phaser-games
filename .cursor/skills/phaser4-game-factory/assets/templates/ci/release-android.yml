# .github/workflows/release-android.yml — build one game's AAB and upload to Play internal track.
# Trigger per game via a tag like game-001-vX.Y.Z. See references/04-ci-cd.md.
name: Release Android
on:
  push:
    tags: ['game-*-v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.2', bundler-cache: true }

      - run: pnpm install --frozen-lockfile

      # Derive the game id from the tag: game-001-v1.2.3 -> game-001
      - id: game
        run: echo "id=$(echo '${{ github.ref_name }}' | sed -E 's/-v[0-9].*$//')" >> "$GITHUB_OUTPUT"

      - run: pnpm --filter "@studio/${{ steps.game.outputs.id }}" build:native
      - run: pnpm --filter "@studio/${{ steps.game.outputs.id }}" exec cap sync android

      - name: Fastlane beta
        working-directory: apps/${{ steps.game.outputs.id }}
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}     # base64 keystore
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}               # base64 service-account json
          PKG: ${{ secrets[format('PKG_{0}', steps.game.outputs.id)] }}  # per-game application id
        run: bundle exec fastlane beta
